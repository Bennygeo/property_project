<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FINDAPLOT — See Every Detail. Choose with Confidence.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore properties through stunning drone views and detailed photography, so you can understand every angle before your visit. Make informed property decisions with greater clarity, transparency, and confidence.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Font Preconnect & Non-Blocking Async Stylesheet Loading for Fastest FCP/LCP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&display=swap">
  </noscript>

  <!-- Instant Minimalist Preloader Styles (paints in first frame, dissolves in 120ms) -->
  <style>
    .fap-preloader-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 999999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.12s ease-out, visibility 0.12s ease-out;
    }
    .fap-preloader-wrap.fap-fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .fap-brand-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(26px, 6vw, 36px);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0f172a;
      user-select: none;
    }
    .fap-brand-text span {
      color: #b91c1c;
    }
  </style>
</head>
<body class="antialiased">
  <!-- Ultra-Lightweight Zero-JS Minimalist Preloader -->
  <div id="app-preloader" class="fap-preloader-wrap" aria-label="Loading findAplot.in">
    <div class="fap-brand-text">find<span>A</span>plot.in</div>
  </div>

  <app-root></app-root>

  <script>
    // Fail-safe auto-dismiss after 6 seconds in case of catastrophic network failure
    setTimeout(function() {
      var p = document.getElementById('app-preloader');
      if (p && !p.classList.contains('fap-fade-out')) {
        p.classList.add('fap-fade-out');
        setTimeout(function() { p.remove(); }, 350);
      }
    }, 6000);
  </script>
</body>
</html>
