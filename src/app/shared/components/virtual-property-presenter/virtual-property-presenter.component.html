@if (isVisible()) {
<div
  class="vpp-standing-stage"
  [class.is-speaking]="isSpeaking()"
  (click)="onCharacterClick()"
  (contextmenu)="onCharacterRightClick($event)"
  title="Click to Pause / Replay • Right-click for ElevenLabs Voice Setup"
>
  <!-- Sleek Audio Waveform Floating Indicator (When Speaking) -->
  @if (isSpeaking() && !isPaused()) {
  <div class="vpp-speech-indicator" aria-live="polite">
    <span class="vpp-wave-bar bar-1"></span>
    <span class="vpp-wave-bar bar-2"></span>
    <span class="vpp-wave-bar bar-3"></span>
    <span class="vpp-wave-bar bar-4"></span>
    <span class="vpp-advisor-name">Virtual Property Advisor</span>
  </div>
  }

  <!-- Ground Contact Shadow on Taskbar -->
  <div class="vpp-ground-shadow"></div>

  <!-- Photorealistic Real Estate Advisor Figure with Natural Breathing & Speech Micro-Movement -->
  <div
    class="vpp-figure-wrapper"
    [style.transform]="
      'translateY(' + headNodY() + 'px) rotate(' + headTiltDeg() + 'deg)'
    "
  >
    <img
      src="/assets/presenter_advisor.png"
      alt="Property Advisor"
      class="vpp-advisor-photo"
      loading="eager"
      decoding="async"
    />
  </div>
</div>
}

<!-- Right-Click ElevenLabs Voice Configuration Modal -->
@if (isSettingsOpen()) {
<div class="vpp-config-backdrop" (click)="isSettingsOpen.set(false)">
  <div class="vpp-config-modal" (click)="$event.stopPropagation()">
    <div class="vpp-config-head">
      <span>ElevenLabs Voice &amp; Script Setup</span>
      <button type="button" class="vpp-config-close" (click)="isSettingsOpen.set(false)">✕</button>
    </div>
    <label class="vpp-field-label">
      ElevenLabs API Key
      <input
        type="password"
        class="vpp-input"
        placeholder="Paste xi-api-key"
        [ngModel]="inputApiKey()"
        (ngModelChange)="inputApiKey.set($event)"
      />
    </label>
    <label class="vpp-field-label">
      Preset Voice
      <select class="vpp-select" [ngModel]="inputVoiceId()" (ngModelChange)="inputVoiceId.set($event)">
        @for (preset of ttsService.presets; track preset.id) {
        <option [value]="preset.id">{{ preset.name }}</option>
        }
      </select>
    </label>
    <label class="vpp-field-label">
      Or Trained / Cloned Voice ID
      <input
        type="text"
        class="vpp-input"
        placeholder="e.g. 21m00Tcm4TlvDq8ikWAM"
        [ngModel]="customVoiceIdInput()"
        (ngModelChange)="customVoiceIdInput.set($event)"
      />
    </label>
    <label class="vpp-field-label">
      10-30s Speech Text
      <textarea
        class="vpp-textarea"
        rows="3"
        [ngModel]="scriptText()"
        (ngModelChange)="scriptText.set($event)"
      ></textarea>
    </label>
    <button type="button" class="vpp-save-speak-btn" (click)="saveVoiceSettingsAndSpeak()">
      Save &amp; Speak
    </button>
  </div>
</div>
}
