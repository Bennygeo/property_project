@if (isVisible()) {
<div
  class="vpp-standing-stage"
  [class.is-speaking]="isSpeaking()"
  (click)="onCharacterClick()"
  (contextmenu)="onCharacterRightClick($event)"
  title="Click to Replay / Pause • Right-click to configure ElevenLabs Voice"
>
  <!-- Full-Body 3D-Shaded 2D Character Standing Directly on the Bottom Edge (Over Taskbar) -->
  <svg
    class="vpp-fullbody-svg"
    viewBox="0 0 220 420"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <!-- 3D Subsurface Skin Lighting -->
      <radialGradient id="vppSkin3D" cx="42%" cy="35%" r="64%">
        <stop offset="0%" stop-color="#ffe6d4" />
        <stop offset="55%" stop-color="#f3c3a4" />
        <stop offset="88%" stop-color="#dc9e79" />
        <stop offset="100%" stop-color="#c3805b" />
      </radialGradient>

      <!-- 3D Neck & Hand Shading -->
      <linearGradient id="vppNeck3D" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#bc7955" />
        <stop offset="40%" stop-color="#df9f7a" />
        <stop offset="100%" stop-color="#f0be9e" />
      </linearGradient>

      <!-- 3D Cheek Subsurface Scattering -->
      <radialGradient id="vppCheekGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f28472" stop-opacity="0.34" />
        <stop offset="100%" stop-color="#f28472" stop-opacity="0" />
      </radialGradient>

      <!-- 3D Volumetric Hair Shader -->
      <radialGradient id="vppHair3D" cx="38%" cy="25%" r="70%">
        <stop offset="0%" stop-color="#3b4254" />
        <stop offset="48%" stop-color="#1e2433" />
        <stop offset="100%" stop-color="#0f131c" />
      </radialGradient>

      <!-- 3D Tailored Navy Suit Blazer -->
      <linearGradient id="vppBlazer3D" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#25354d" />
        <stop offset="50%" stop-color="#152033" />
        <stop offset="100%" stop-color="#0b111d" />
      </linearGradient>

      <!-- 3D Sleeve Shader -->
      <linearGradient id="vppSleeve3D" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#293a54" />
        <stop offset="100%" stop-color="#111a2b" />
      </linearGradient>

      <!-- 3D Tailored Trousers Shader -->
      <linearGradient id="vppTrousers3D" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="50%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#090e1a" />
      </linearGradient>

      <!-- 3D Leather Dress Shoes -->
      <linearGradient id="vppShoe3D" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3b2316" />
        <stop offset="55%" stop-color="#1f1109" />
        <stop offset="100%" stop-color="#0d0704" />
      </linearGradient>

      <!-- 3D Emerald Tie -->
      <linearGradient id="vppTie3D" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#047857" />
      </linearGradient>

      <!-- 3D Glossy Iris Shader -->
      <radialGradient id="vppIris3D" cx="45%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#5b3a29" />
        <stop offset="65%" stop-color="#2c1b12" />
        <stop offset="100%" stop-color="#140b07" />
      </radialGradient>

      <!-- 3D Lip Shaders -->
      <linearGradient id="vppUpperLip" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#b85d56" />
        <stop offset="100%" stop-color="#96423c" />
      </linearGradient>
      <linearGradient id="vppLowerLip" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d47972" />
        <stop offset="60%" stop-color="#b85b54" />
        <stop offset="100%" stop-color="#8f3d37" />
      </linearGradient>

      <!-- Inner Oral Cavity & Tongue 3D Gradients -->
      <radialGradient id="vppOralCavity" cx="50%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#3b0d11" />
        <stop offset="100%" stop-color="#1f0507" />
      </radialGradient>
      <linearGradient id="vppTongue" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e0636b" />
        <stop offset="100%" stop-color="#b53d46" />
      </linearGradient>

      <!-- Character Contact Shadow on Taskbar -->
      <radialGradient id="vppGroundShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.42" />
        <stop offset="70%" stop-color="#000000" stop-opacity="0.16" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0" />
      </radialGradient>

      <!-- Soft 3D Cutout Depth Filter -->
      <filter id="vppBodyDepth" x="-15%" y="-10%" width="130%" height="125%">
        <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#090d16" flood-opacity="0.32" />
      </filter>
    </defs>

    <!-- =================================================================
         GROUND CONTACT SHADOW RIGHT ON THE TASKBAR LINE (Y = 415)
         ================================================================= -->
    <ellipse cx="110" cy="414" rx="54" ry="6" fill="url(#vppGroundShadow)" />

    <!-- =================================================================
         LOWER BODY: LEGS, TROUSERS & DRESS SHOES STANDING AT BOTTOM=0
         ================================================================= -->
    <g class="vpp-legs-group" filter="url(#vppBodyDepth)">
      <!-- Left Leg Trousers -->
      <path
        d="M 78 272 L 108 272 L 104 398 L 82 398 Z"
        fill="url(#vppTrousers3D)"
      />
      <!-- Left Trouser 3D Crease Highlight -->
      <line x1="93" y1="280" x2="92" y2="394" stroke="#334155" stroke-width="1.2" opacity="0.55" />

      <!-- Right Leg Trousers -->
      <path
        d="M 112 272 L 142 272 L 138 398 L 116 398 Z"
        fill="url(#vppTrousers3D)"
      />
      <!-- Right Trouser 3D Crease Highlight -->
      <line x1="127" y1="280" x2="128" y2="394" stroke="#334155" stroke-width="1.2" opacity="0.55" />

      <!-- Pelvis / Suit Trouser Waist Block -->
      <path
        d="M 76 254 L 144 254 L 142 280 L 110 284 L 78 280 Z"
        fill="url(#vppTrousers3D)"
      />

      <!-- Left Leather Oxford Shoe (Planted on bottom taskbar line Y=414) -->
      <path
        d="M 82 395 L 104 395 L 106 413 C 106 415, 70 415, 70 412 C 70 404, 78 400, 82 395 Z"
        fill="url(#vppShoe3D)"
      />
      <path d="M 74 408 Q 86 403 103 409" fill="none" stroke="#6b442e" stroke-width="1.2" opacity="0.65" />

      <!-- Right Leather Oxford Shoe (Planted on bottom taskbar line Y=414) -->
      <path
        d="M 116 395 L 138 395 C 142 400, 150 404, 150 412 C 150 415, 114 415, 114 413 Z"
        fill="url(#vppShoe3D)"
      />
      <path d="M 117 409 Q 134 403 146 408" fill="none" stroke="#6b442e" stroke-width="1.2" opacity="0.65" />
    </g>

    <!-- =================================================================
         UPPER TORSO, BLAZER & GESTURING ARMS
         ================================================================= -->
    <g class="vpp-torso-group" [class.speaking-breath]="isSpeaking()" filter="url(#vppBodyDepth)">
      <!-- Neck Column -->
      <path
        d="M 96 132 L 96 164 C 96 172, 124 172, 124 164 L 124 132 Z"
        fill="url(#vppNeck3D)"
      />
      <ellipse cx="110" cy="140" rx="15" ry="6" fill="#8f5336" opacity="0.34" />

      <!-- Left Arm (Natural Stance + Subtle Speaking Motion) -->
      <g
        class="vpp-left-arm"
        [style.transform]="'rotate(' + (handGesturePhase() * -4) + 'deg)'"
        style="transform-origin: 72px 172px"
      >
        <path
          d="M 74 164 C 56 170, 48 205, 52 246 L 68 246 C 68 214, 72 190, 78 176 Z"
          fill="url(#vppSleeve3D)"
        />
        <!-- White Shirt Cuff -->
        <rect x="52" y="244" width="16" height="5" fill="#f8fafc" />
        <!-- 3D Sculpted Left Hand -->
        <ellipse cx="60" cy="256" rx="8.5" ry="10.5" fill="url(#vppSkin3D)" />
        <ellipse cx="65" cy="254" rx="3.2" ry="5.5" fill="#dc9e79" />
      </g>

      <!-- Tailored Suit Jacket Torso -->
      <path
        d="M 68 162
           C 82 156, 96 156, 110 156
           C 124 156, 138 156, 152 162
           L 146 266
           C 146 271, 126 274, 110 274
           C 94 274, 74 271, 74 266 Z"
        fill="url(#vppBlazer3D)"
      />

      <!-- Crisp White Dress Shirt V-Zone -->
      <polygon points="95,157 110,214 125,157" fill="#f8fafc" />
      <polygon points="92,154 110,178 99,188 86,162" fill="#ffffff" />
      <polygon points="128,154 110,178 121,188 134,162" fill="#e2e8f0" />

      <!-- 3D Emerald Silk Tie -->
      <polygon points="106,174 114,174 116,185 110,191 104,185" fill="url(#vppTie3D)" />
      <polygon points="106,189 114,189 116,232 110,240 104,232" fill="url(#vppTie3D)" />

      <!-- 3D Jacket Lapels & Buttons -->
      <polygon points="86,160 110,218 96,248 76,186" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <polygon points="134,160 110,218 124,248 144,186" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <circle cx="110" cy="236" r="2.6" fill="#0f172a" stroke="#475569" stroke-width="0.8" />
      <circle cx="110" cy="252" r="2.6" fill="#0f172a" stroke="#475569" stroke-width="0.8" />

      <!-- Pocket Square Accent -->
      <polygon points="126,198 138,196 136,204 125,204" fill="#10b981" />

      <!-- Right Arm (Expressive Presenter Gesture While Speaking) -->
      <g
        class="vpp-right-arm"
        [style.transform]="
          isSpeaking()
            ? 'rotate(' + (-18 + handGesturePhase() * 14) + 'deg)'
            : 'rotate(0deg)'
        "
        style="transform-origin: 146px 172px"
      >
        <path
          d="M 146 164 C 164 170, 172 205, 168 244 L 152 244 C 152 214, 148 190, 142 176 Z"
          fill="url(#vppSleeve3D)"
        />
        <!-- White Shirt Cuff -->
        <rect x="152" y="242" width="16" height="5" fill="#f8fafc" />
        <!-- 3D Expressive Right Hand -->
        <ellipse cx="160" cy="254" rx="9" ry="11" fill="url(#vppSkin3D)" />
        <ellipse cx="154" cy="251" rx="3.5" ry="6" fill="#ffe6d4" />
      </g>
    </g>

    <!-- =================================================================
         2.5D ARTICULATED HEAD GROUP (Nods & Tilts in Sync with Speech)
         ================================================================= -->
    <g
      class="vpp-head-group"
      [style.transform]="
        'translateY(' + headNodY() + 'px) rotate(' + headTiltDeg() + 'deg)'
      "
      style="transform-origin: 110px 136px"
    >
      <!-- Back Hair Volume -->
      <path
        d="M 66 86 C 62 42, 88 26, 112 26 C 140 26, 158 44, 154 86 Z"
        fill="url(#vppHair3D)"
      />

      <!-- 3D Ears -->
      <g>
        <ellipse cx="67" cy="96" rx="7.5" ry="12" fill="url(#vppSkin3D)" />
        <ellipse cx="68" cy="96" rx="3.8" ry="7" fill="#c98560" opacity="0.55" />
        <ellipse cx="153" cy="96" rx="7.5" ry="12" fill="url(#vppSkin3D)" />
        <ellipse cx="152" cy="96" rx="3.8" ry="7" fill="#c98560" opacity="0.55" />
      </g>

      <!-- Primary 3D Sculpted Head Mesh -->
      <path
        d="M 70 78
           C 70 48, 88 36, 110 36
           C 132 36, 150 48, 150 78
           C 150 104, 144 126, 130 138
           C 121 145, 115 148, 110 148
           C 105 148, 99 145, 90 138
           C 76 126, 70 104, 70 78 Z"
        fill="url(#vppSkin3D)"
        filter="url(#vppBodyDepth)"
      />

      <!-- 3D Cheek Subsurface Blushes -->
      <circle cx="85" cy="106" r="13" fill="url(#vppCheekGlow)" />
      <circle cx="135" cy="106" r="13" fill="url(#vppCheekGlow)" />

      <!-- 3D Nose Bridge & Tip -->
      <g>
        <path
          d="M 108 78 L 105 102 C 105 106, 115 106, 115 102 L 112 78"
          fill="#e4a987"
          opacity="0.45"
        />
        <path
          d="M 110 77 L 110 100"
          stroke="#fff3e8"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.65"
        />
        <ellipse cx="110" cy="103" rx="6" ry="3.8" fill="#dfa07c" />
        <circle cx="106.8" cy="104" r="1.4" fill="#8f5336" opacity="0.65" />
        <circle cx="113.2" cy="104" r="1.4" fill="#8f5336" opacity="0.65" />
      </g>

      <!-- 3D Eyes with Iris Depth, Specular Catchlights & Blinking Lids -->
      <g class="vpp-eyes-layer">
        <!-- Left Eye -->
        <g transform="translate(91, 85)">
          <ellipse cx="0" cy="-1" rx="10.5" ry="7.2" fill="#c98865" opacity="0.38" />
          <ellipse cx="0" cy="0" rx="9.2" ry="5.8" fill="#ffffff" />
          <g [style.transform]="'translateX(' + eyeLookX() + 'px)'">
            <circle cx="0" cy="0" r="4.8" fill="url(#vppIris3D)" />
            <circle cx="0" cy="0" r="2.3" fill="#090605" />
            <circle cx="-1.6" cy="-1.6" r="1.3" fill="#ffffff" />
            <circle cx="1.4" cy="1.4" r="0.65" fill="#ffffff" opacity="0.85" />
          </g>
          <path
            d="M -9.8 -0.5 Q 0 -7 9.8 -0.5"
            fill="none"
            stroke="#2b1912"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          @if (isBlinking()) {
          <ellipse cx="0" cy="0" rx="9.8" ry="6.2" fill="url(#vppSkin3D)" />
          <path
            d="M -9.2 1 Q 0 4.6 9.2 1"
            fill="none"
            stroke="#2b1912"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          }
        </g>

        <!-- Right Eye -->
        <g transform="translate(129, 85)">
          <ellipse cx="0" cy="-1" rx="10.5" ry="7.2" fill="#c98865" opacity="0.38" />
          <ellipse cx="0" cy="0" rx="9.2" ry="5.8" fill="#ffffff" />
          <g [style.transform]="'translateX(' + eyeLookX() + 'px)'">
            <circle cx="0" cy="0" r="4.8" fill="url(#vppIris3D)" />
            <circle cx="0" cy="0" r="2.3" fill="#090605" />
            <circle cx="-1.6" cy="-1.6" r="1.3" fill="#ffffff" />
            <circle cx="1.4" cy="1.4" r="0.65" fill="#ffffff" opacity="0.85" />
          </g>
          <path
            d="M -9.8 -0.5 Q 0 -7 9.8 -0.5"
            fill="none"
            stroke="#2b1912"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          @if (isBlinking()) {
          <ellipse cx="0" cy="0" rx="9.8" ry="6.2" fill="url(#vppSkin3D)" />
          <path
            d="M -9.2 1 Q 0 4.6 9.2 1"
            fill="none"
            stroke="#2b1912"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          }
        </g>
      </g>

      <!-- Expressive 3D Eyebrows -->
      <g
        class="vpp-brows-layer"
        [style.transform]="'translateY(' + browLiftY() + 'px)'"
      >
        <path
          d="M 79 75 Q 91 69 101 74"
          fill="none"
          stroke="#1e2433"
          stroke-width="3.3"
          stroke-linecap="round"
        />
        <path
          d="M 119 74 Q 129 69 141 75"
          fill="none"
          stroke="#1e2433"
          stroke-width="3.3"
          stroke-linecap="round"
        />
      </g>

      <!-- 10 Anatomical 3D Mouth Visemes -->
      <g class="vpp-mouth-layer" transform="translate(110, 123)">
        @switch (currentViseme()) {
          @case ('rest') {
            <path d="M -13 -1 Q -6 -3.2 0 -1.8 Q 6 -3.2 13 -1 Q 0 1.4 -13 -1 Z" fill="url(#vppUpperLip)" />
            <path d="M -12 -0.5 Q 0 5 12 -0.5 Q 0 1.4 -12 -0.5 Z" fill="url(#vppLowerLip)" />
            <path d="M -13.5 -1 Q 0 1.6 13.5 -1" fill="none" stroke="#6e2823" stroke-width="1.2" stroke-linecap="round" />
          }
          @case ('mbp') {
            <path d="M -12 0 Q 0 -1.4 12 0 Q 0 1.6 -12 0 Z" fill="url(#vppUpperLip)" />
            <path d="M -11 0.2 Q 0 3 11 0.2 Z" fill="url(#vppLowerLip)" />
            <line x1="-12.5" y1="0.2" x2="12.5" y2="0.2" stroke="#5c1f1b" stroke-width="1.5" stroke-linecap="round" />
          }
          @case ('aa') {
            <path d="M -13 -2.8 C -13 -6.5, 13 -6.5, 13 -2.8 C 14 7.5, 8.5 12, 0 12 C -8.5 12, -14 7.5, -13 -2.8 Z" fill="url(#vppOralCavity)" />
            <path d="M -10 -4.2 L 10 -4.2 L 9 -0.8 L -9 -0.8 Z" fill="#ffffff" />
            <ellipse cx="0" cy="7.8" rx="8" ry="3.8" fill="url(#vppTongue)" />
            <path d="M -6.5 9.8 L 6.5 9.8 L 5.5 11.2 L -5.5 11.2 Z" fill="#f1f5f9" opacity="0.85" />
            <path d="M -14 -2.2 C -7.5 -7, 7.5 -7, 14 -2.2 C 13 8.8, 7.5 13.2, 0 13.2 C -7.5 13.2, -13 8.8, -14 -2.2 Z" fill="none" stroke="url(#vppLowerLip)" stroke-width="2.6" />
          }
          @case ('oh') {
            <ellipse cx="0" cy="3.2" rx="8.8" ry="8.4" fill="url(#vppOralCavity)" />
            <path d="M -6 -3.2 L 6 -3.2 L 5 -0.6 L -5 -0.6 Z" fill="#ffffff" />
            <ellipse cx="0" cy="7.4" rx="5.5" ry="3.2" fill="url(#vppTongue)" />
            <ellipse cx="0" cy="3.2" rx="9.5" ry="9" fill="none" stroke="url(#vppLowerLip)" stroke-width="2.8" />
          }
          @case ('oo') {
            <ellipse cx="0" cy="1.8" rx="5.4" ry="5" fill="url(#vppOralCavity)" />
            <ellipse cx="0" cy="3.8" rx="3.2" ry="1.8" fill="url(#vppTongue)" />
            <ellipse cx="0" cy="1.8" rx="6.2" ry="5.8" fill="none" stroke="url(#vppUpperLip)" stroke-width="3" />
          }
          @case ('ee') {
            <path d="M -14 -1.8 Q 0 -4.2 14 -1.8 Q 12 6 0 6 Q -12 6 -14 -1.8 Z" fill="url(#vppOralCavity)" />
            <path d="M -11.5 -2 L 11.5 -2 L 10.5 1 L -10.5 1 Z" fill="#ffffff" />
            <path d="M -9 3.2 L 9 3.2 L 8 5 L -8 5 Z" fill="#f8fafc" />
            <path d="M -14.5 -1.8 Q 0 -4.5 14.5 -1.8 Q 12.5 6.6 0 6.6 Q -12.5 6.6 -14.5 -1.8 Z" fill="none" stroke="url(#vppLowerLip)" stroke-width="2.2" />
          }
          @case ('ih') {
            <path d="M -11.5 -1.8 Q 0 -4.2 11.5 -1.8 Q 10 6.8 0 6.8 Q -10 6.8 -11.5 -1.8 Z" fill="url(#vppOralCavity)" />
            <path d="M -8.8 -2.2 L 8.8 -2.2 L 7.8 0.4 L -7.8 0.4 Z" fill="#ffffff" />
            <ellipse cx="0" cy="4.8" rx="6.2" ry="2.4" fill="url(#vppTongue)" />
            <path d="M -12 -1.8 Q 0 -4.5 12 -1.8 Q 10.5 7.4 0 7.4 Q -10.5 7.4 -12 -1.8 Z" fill="none" stroke="url(#vppLowerLip)" stroke-width="2.3" />
          }
          @case ('fv') {
            <path d="M -11.5 -1.4 Q 0 -3.2 11.5 -1.4 Q 9 2.8 0 2.8 Q -9 2.8 -11.5 -1.4 Z" fill="url(#vppOralCavity)" />
            <path d="M -8.2 -1.8 L 8.2 -1.8 L 7.4 1 L -7.4 1 Z" fill="#ffffff" />
            <path d="M -11 0.8 Q 0 4.8 11 0.8" fill="none" stroke="url(#vppLowerLip)" stroke-width="2.8" stroke-linecap="round" />
          }
          @case ('sz') {
            <path d="M -12.5 -1.4 Q 0 -2.8 12.5 -1.4 Q 11 3.5 0 3.5 Q -11 3.5 -12.5 -1.4 Z" fill="#ffffff" />
            <line x1="-10" y1="0.8" x2="10" y2="0.8" stroke="#cbd5e1" stroke-width="0.9" />
            <path d="M -13 -1.4 Q 0 -3.2 13 -1.4 Q 11.5 4 0 4 Q -11.5 4 -13 -1.4 Z" fill="none" stroke="url(#vppLowerLip)" stroke-width="2.1" />
          }
          @default {
            <path d="M -11.5 -1.8 Q 0 -4.2 11.5 -1.8 Q 10 6.5 0 6.5 Q -10 6.5 -11.5 -1.8 Z" fill="url(#vppOralCavity)" />
            <ellipse cx="0" cy="2" rx="5.8" ry="3.6" fill="url(#vppTongue)" />
            <path d="M -8.8 -2.2 L 8.8 -2.2 L 7.8 0.3 L -7.8 0.3 Z" fill="#ffffff" />
            <path d="M -12 -1.8 Q 0 -4.5 12 -1.8 Q 10.5 7 0 7 Q -10.5 7 -12 -1.8 Z" fill="none" stroke="url(#vppLowerLip)" stroke-width="2.2" />
          }
        }
      </g>

      <!-- 3D Front Hair Sweep & Sideburns -->
      <path
        d="M 68 80
           C 67 56, 81 36, 108 33
           C 134 31, 152 45, 152 78
           C 148 61, 135 50, 114 52
           C 93 54, 77 60, 70 80 Z"
        fill="url(#vppHair3D)"
      />
      <path
        d="M 85 45 Q 108 37 132 46"
        fill="none"
        stroke="#64748b"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.45"
      />
    </g>
  </svg>
</div>
}

<!-- Optional Right-Click ElevenLabs Voice Configuration Modal (Hidden unless user right-clicks character) -->
@if (isSettingsOpen()) {
<div class="vpp-config-backdrop" (click)="isSettingsOpen.set(false)">
  <div class="vpp-config-modal" (click)="$event.stopPropagation()">
    <div class="vpp-config-head">
      <span>ElevenLabs Voice &amp; Script Setup</span>
      <button type="button" class="vpp-config-close" (click)="isSettingsOpen.set(false)">✕</button>
    </div>
    <label class="vpp-field-label">
      ElevenLabs API Key
      <input
        type="password"
        class="vpp-input"
        placeholder="Paste xi-api-key"
        [ngModel]="inputApiKey()"
        (ngModelChange)="inputApiKey.set($event)"
      />
    </label>
    <label class="vpp-field-label">
      Preset Voice
      <select class="vpp-select" [ngModel]="inputVoiceId()" (ngModelChange)="inputVoiceId.set($event)">
        @for (preset of ttsService.presets; track preset.id) {
        <option [value]="preset.id">{{ preset.name }}</option>
        }
      </select>
    </label>
    <label class="vpp-field-label">
      Or Trained / Cloned Voice ID
      <input
        type="text"
        class="vpp-input"
        placeholder="e.g. 21m00Tcm4TlvDq8ikWAM"
        [ngModel]="customVoiceIdInput()"
        (ngModelChange)="customVoiceIdInput.set($event)"
      />
    </label>
    <label class="vpp-field-label">
      10-30s Speech Text
      <textarea
        class="vpp-textarea"
        rows="3"
        [ngModel]="scriptText()"
        (ngModelChange)="scriptText.set($event)"
      ></textarea>
    </label>
    <button type="button" class="vpp-save-speak-btn" (click)="saveVoiceSettingsAndSpeak()">
      Save &amp; Speak
    </button>
  </div>
</div>
}
