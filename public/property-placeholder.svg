<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#475569" opacity="0.6"/>
    </pattern>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c73434"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#archGrid)"/>

  <!-- Architectural Structure Illustration -->
  <g transform="translate(400, 240)">
    <!-- Main Villa Geometry -->
    <!-- Base platform -->
    <polygon points="-240,110 240,110 200,140 -200,140" fill="#1e293b" opacity="0.8"/>
    
    <!-- Left Wing (2-Story Modern Block) -->
    <polygon points="-200,110 -200,-50 -60,-50 -60,110" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Large Glass Facade Grid -->
    <rect x="-180" y="-30" width="100" height="60" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-130" y1="-30" x2="-130" y2="30" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-180" y1="0" x2="-80" y2="0" stroke="#38bdf8" stroke-width="1"/>
    <!-- Ground Floor Entry -->
    <rect x="-170" y="50" width="80" height="60" fill="#0f172a" stroke="#64748b" stroke-width="1"/>

    <!-- Central Pavilion / Cantilever -->
    <polygon points="-80,70 120,70 160,-20 -40,-20" fill="url(#roofGrad)" opacity="0.9"/>
    <polygon points="-40,-20 160,-20 140,-40 -60,-40" fill="#a82424"/>
    
    <!-- Right High-Rise Tower Element -->
    <polygon points="50,110 50,-120 180,-120 180,110" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <!-- Tower Windows -->
    <g fill="#f59e0b" fill-opacity="0.3">
      <rect x="70" y="-100" width="35" height="18" rx="2"/>
      <rect x="125" y="-100" width="35" height="18" rx="2"/>
      <rect x="70" y="-70" width="35" height="18" rx="2"/>
      <rect x="125" y="-70" width="35" height="18" rx="2"/>
      <rect x="70" y="-40" width="35" height="18" rx="2"/>
      <rect x="125" y="-40" width="35" height="18" rx="2"/>
      <rect x="70" y="-10" width="35" height="18" rx="2"/>
      <rect x="125" y="-10" width="35" height="18" rx="2"/>
    </g>

    <!-- Balcony Railing -->
    <line x1="-70" y1="20" x2="60" y2="20" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-70" y1="28" x2="60" y2="28" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Ambient Pool / Reflection Strip -->
    <polygon points="-220,120 220,120 180,145 -180,145" fill="#0ea5e9" opacity="0.35"/>
  </g>

  <!-- Technical Stamp & Editorial Overlay -->
  <g transform="translate(40, 440)">
    <rect x="0" y="-22" width="220" height="28" rx="4" fill="#020617" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="-8" r="4" fill="#10b981"/>
    <text x="28" y="-4" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
      MANNIDAM ARCHITECTURAL DEED
    </text>
  </g>

  <g transform="translate(560, 440)">
    <text x="200" y="-4" text-anchor="end" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      VERIFIED PROPERTY DOSSIER
    </text>
  </g>
</svg>
